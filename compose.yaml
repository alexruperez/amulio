services:
  amulio:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      AMULIO_PUBLIC_URL: ${AMULIO_PUBLIC_URL:?Set AMULIO_PUBLIC_URL in .env}
      AMULIO_INSTALL_TOKEN: ${AMULIO_INSTALL_TOKEN:?Set AMULIO_INSTALL_TOKEN in .env}
      AMULIO_TOKEN_SECRET: ${AMULIO_TOKEN_SECRET:?Set AMULIO_TOKEN_SECRET in .env}
      AMULE_API_ADMIN_PASSWORD_FILE: /run/secrets/amuleapi_admin_password
      AMULE_API_BASE_URL: http://amuleapi:4713/api/v0
    volumes:
      # Keep this path identical to aMule's Incoming directory.
      - amule_incoming:/data/incoming:ro
    secrets:
      - amuleapi_admin_password
    ports:
      - "${AMULIO_PORT:-8000}:8000"
    depends_on:
      amuleapi:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    networks: [frontend, backend]

  amuleapi:
    build:
      context: .
      dockerfile: docker/amuleapi/Dockerfile
    restart: unless-stopped
    volumes:
      - amule_incoming:/data/incoming
      - amule_temp:/data/temp
      - amule_config:/data/config
    secrets:
      - amule_ec_password
      - amuleapi_admin_password
    expose:
      - "4713"
    networks: [backend]

volumes:
  amule_config:
  amule_incoming:
  amule_temp:

secrets:
  amule_ec_password:
    file: ${AMULE_EC_PASSWORD_FILE:-./secrets/amule_ec_password}
  amuleapi_admin_password:
    file: ${AMULEAPI_ADMIN_PASSWORD_FILE:-./secrets/amuleapi_admin_password}

networks:
  frontend:
    driver: bridge
  backend:
    internal: true
