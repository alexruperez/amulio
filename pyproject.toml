[project]
name = "amulio"
version = "0.1.0"
description = "Self-hosted Stremio addon backed by aMule and amuleapi."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Alejandro Ruperez" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  # FileResponse range support is part of the Stremio playback contract; keep
  # the HTTP layer on a patched Starlette release instead of relying only on
  # FastAPI's transitive constraint.
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9,<3.0",
  "playwright>=1.52,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amulio"]
include = ["src/amulio/assets/*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
  "integration: requires the Docker aMule/amuleapi fixture",
  "ui: requires the Playwright Chromium browser",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
